name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # to post the comment
  models: read           # to call GitHub Models

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history, so we can diff against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- . ':(exclude)**/package-lock.json' > diff.txt
          echo "Diff size: $(wc -c < diff.txt) bytes"

      - name: Run AI review
        run: node .github/scripts/ai-review.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}